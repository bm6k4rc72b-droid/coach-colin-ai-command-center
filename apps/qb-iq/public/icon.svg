<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="QB IQ">
  <rect width="192" height="192" rx="42" fill="#07090c"/>
  <!-- The OODA loop: an open arc, because the loop is never closed. -->
  <path d="M96 32a64 64 0 1 1-45.3 18.7" fill="none" stroke="#1e252e" stroke-width="10" stroke-linecap="round"/>
  <path d="M96 32a64 64 0 0 1 45.3 109.3" fill="none" stroke="#4cc9ff" stroke-width="10" stroke-linecap="round"/>
  <!-- Release point. -->
  <circle cx="141" cy="141" r="10" fill="#4cc9ff"/>
  <!-- Kinetic chain: four segment peaks, proximal to distal. -->
  <g fill="#f2f5f8">
    <rect x="62" y="112" width="10" height="18" rx="3"/>
    <rect x="80" y="98" width="10" height="32" rx="3"/>
    <rect x="98" y="76" width="10" height="54" rx="3"/>
    <rect x="116" y="88" width="10" height="42" rx="3"/>
  </g>
</svg>
