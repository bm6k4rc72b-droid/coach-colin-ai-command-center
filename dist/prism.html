  const CHAIN_WINDOW = 180000;  // 3 minutes to keep it alive
  const CHAIN_MAX    = 2.5;

  let chain = { mult: 1, last: 0, timer: null };
  const chainListeners = new Set();

  function chainNotify() {
    const remain = chain.last ? Math.max(0, CHAIN_WINDOW - (Date.now() - chain.last)) : 0;
    chainListeners.forEach(fn => fn({
      mult: chain.mult,
      live: chain.mult > 1,
      remain,
      frac: remain / CHAIN_WINDOW
    }));
  }

  function chainBump() {
    const now = Date.now();
    if (chain.last && now - chain.last > CHAIN_WINDOW) chain.mult = 1;
    chain.mult = Math.min(CHAIN_MAX, U.round1(chain.mult + 0.3));
    chain.last = now;

    clearTimeout(chain.timer);
    chain.timer = setTimeout(() => { chain.mult = 1; chain.last = 0; chainNotify(); }, CHAIN_WINDOW);
    chainNotify();
    return chain.mult;
  }

  const chainState = () => ({ mult: chain.mult, live: chain.mult > 1 });
  const onChain = fn => { chainListeners.add(fn); return () => chainListeners.delete(fn); };

  // Keep the decay bar honest while nothing else is happening.
  setInterval(() => { if (chain.mult > 1) chainNotify(); }, 1000);

  /* ── daily roll: streak + directives ──────────────────────── */

  /** Called once at boot and again whenever an action lands. */
  function touchDay() {
    const today = U.dayKey();
    const out = { newDay: false, streakBroken: false, streak: 0 };

    S.update(s => {
      if (s.lastActiveDay !== today) {
        const gap = s.lastActiveDay ? U.daysBetween(s.lastActiveDay, today) : null;
        if (gap === 1) s.streak += 1;
        else if (gap === null) s.streak = 1;
        else { out.streakBroken = s.streak > 1; s.streak = 1; }

        s.lastActiveDay = today;
        s.bestStreak = Math.max(s.bestStreak, s.streak);
        out.newDay = true;
      }
      out.streak = s.streak;

      // Roll a fresh set of directives when the day turns over.
      if (s.quests.day !== today) {
        s.quests = {
          day: today,
          ids: P.quests.forDay(today, unlockedIds(s)).map(q => q.id),
          progress: {},
          claimed: []
        };
      }
    });

    return out;
  }

  /** The day's three directives, with live progress attached. */
  function directives() {
    const s = S.get();
    return s.quests.ids.map(id => {
      const q = P.quests.byId(id);
      if (!q) return null;
      const have = s.quests.progress[id] || 0;
      return {
        ...q,
        have: Math.min(have, q.need),
        done: s.quests.claimed.indexOf(id) !== -1
      };
    }).filter(Boolean);
  }

  /**
   * Advance any directive listening for `track`.
   * Returns the directives that just completed, so the UI can celebrate.
   */
  function advanceQuests(track, amount) {
    const finished = [];
    S.update(s => {
      s.quests.ids.forEach(id => {
        const q = P.quests.byId(id);
        if (!q || q.track !== track) return;
        if (s.quests.claimed.indexOf(id) !== -1) return;

        const next = (s.quests.progress[id] || 0) + (amount || 1);
        s.quests.progress[id] = next;

        if (next >= q.need) {
          s.quests.claimed.push(id);
          s.xp += q.xp;
          finished.push(q);
        }
      });
    });
    return finished;
  }

  /* ── awarding XP ──────────────────────────────────────────── */

  const events = new Set();
  const emit = payload => events.forEach(fn => fn(payload));
  const on = fn => { events.add(fn); return () => events.delete(fn); };

  /**
   * Grant XP and settle every knock-on effect in one place:
   * level-ups, newly unlocked agents, achievements.
   */
  function award(amount, reason, ctx) {
    const before = S.get().level;
    let levelled = [];

    S.update(s => { s.xp += Math.round(amount); });

    // Level up as many times as the XP allows.
    S.update(s => {
      while (s.xp >= totalFor(s.level + 1)) {
        s.level += 1;
        levelled.push(s.level);
      }
    });

    const after = S.get().level;
    const freshAgents = levelled.length
      ? P.agents.list.filter(a => a.unlock.level > before && a.unlock.level <= after)
      : [];

    const badges = checkAchievements(ctx || {});

    const payload = { amount: Math.round(amount), reason, levelled, freshAgents, badges };
    emit(payload);
    return payload;
  }

  /* ── achievements ─────────────────────────────────────────── */

  function checkAchievements(ctx) {
    const earned = [];
    const s = S.get();
    P.quests.ACHIEVEMENTS.forEach(a => {
      if (s.achievements.indexOf(a.id) !== -1) return;
      let ok = false;
      try { ok = !!a.test(s, ctx || {}); } catch (_) { ok = false; }
      if (ok) earned.push(a);
    });

    if (earned.length) {
      S.update(st => { earned.forEach(a => st.achievements.push(a.id)); });
    }
    return earned;
  }

  /* ── the one call the app makes after a mission ───────────── */

  /**
   * Record a completed mission run and pay out everything it earns.
   * Returns { xp, mult, levelled, freshAgents, badges, quests }.
   */
  function recordRun(agentId, mission, meta) {
    const info = meta || {};
    touchDay();

    const first = !S.get().agentSeen[agentId];
    const mult = chainBump();

    let base = mission.xp || 40;
    if (first) base += 30;                       // first contact bonus
    if (info.live) base += 8;                    // live model runs cost you something
    const gained = Math.round(base * mult);

    S.update(s => {
      s.runs += 1;
      s.agentRuns[agentId] = (s.agentRuns[agentId] || 0) + 1;
      if (!s.agentSeen[agentId]) s.agentSeen[agentId] = Date.now();
    });

    // Directives that a run can satisfy.
    const doneQuests = []
      .concat(advanceQuests('run', 1))
      .concat(first ? advanceQuests('firstTouch', 1) : [])
      .concat(info.viaBeam ? advanceQuests('beam', 1) : [])
      .concat(mult >= 2 ? advanceQuests('combo2', 1) : [])
      .concat(agentId === 'verse' ? advanceQuests('agent:verse', 1) : [])
      .concat((agentId === 'ledger' || agentId === 'cipher') ? advanceQuests('agent:money', 1) : [])
      .concat(uniqueAgentQuest())
      .concat(repeatAgentQuest(agentId));

    const s = S.get();
    const allQuests = s.quests.ids.length > 0 && s.quests.ids.every(id => s.quests.claimed.indexOf(id) !== -1);

    const res = award(gained, 'mission', { combo: mult, allQuests, live: !!info.live });

    return {
      xp: gained, mult, first,
      levelled: res.levelled,
      freshAgents: res.freshAgents,
      badges: res.badges,
      quests: doneQuests
    };
  }

  /* Directives that need a look at history rather than a single event. */

  function uniqueAgentQuest() {
    const s = S.get();
    const uniq = Object.keys(s.agentRuns).length;
    const id = s.quests.ids.find(i => (P.quests.byId(i) || {}).track === 'agentUnique');
    if (!id || s.quests.claimed.indexOf(id) !== -1) return [];
    const q = P.quests.byId(id);
    const done = [];
    S.update(st => {
      st.quests.progress[id] = uniq;
      if (uniq >= q.need) { st.quests.claimed.push(id); st.xp += q.xp; done.push(q); }
    });
    return done;
  }

  function repeatAgentQuest(agentId) {
    const s = S.get();
    const id = s.quests.ids.find(i => (P.quests.byId(i) || {}).track === 'agentRepeat');
    if (!id || s.quests.claimed.indexOf(id) !== -1) return [];
    const q = P.quests.byId(id);
    const runsToday = s.agentRuns[agentId] || 0;
    const best = Math.max(runsToday, s.quests.progress[id] || 0);
    const done = [];
    S.update(st => {
      st.quests.progress[id] = best;
      if (best >= q.need) { st.quests.claimed.push(id); st.xp += q.xp; done.push(q); }
    });
    return done;
  }

  /** Small side actions worth a nudge of XP. */
  function recordSide(kind) {
    touchDay();
    let xp = 0, quests = [];

    if (kind === 'copy') {
      S.update(s => { s.copies += 1; });
      quests = advanceQuests('copy', 1);
      xp = 10;
    } else if (kind === 'refine') {
      S.update(s => { s.refines += 1; });
      quests = advanceQuests('refine', 1);
      xp = 14;
    }

    const res = award(xp, kind, { combo: chain.mult });
    return { xp, quests, badges: res.badges, levelled: res.levelled };
  }

  /* ── suggestions: the "what next" engine ──────────────────── */

  /**
   * Three next-best moves, chosen to pull the player toward whatever
   * is closest to paying out — an unlock, a directive, or a mastery tier.
   */
  function suggestions() {
    const s = S.get();
    const open = unlockedIds(s);
    const out = [];

    // 1. An unclaimed directive that maps onto a concrete agent.
    const pending = directives().filter(d => !d.done);
    pending.forEach(d => {
      if (out.length >= 1) return;
      let agentId = null;
      if (d.track === 'agent:verse') agentId = 'verse';
      else if (d.track === 'agent:money') agentId = open.indexOf('cipher') !== -1 ? 'cipher' : 'ledger';
      else if (d.track === 'firstTouch') agentId = open.find(id => !s.agentRuns[id]);
      if (agentId && P.agents.byId[agentId]) {
        const a = P.agents.byId[agentId];
        out.push({
          tag: 'directive', hue: a.hue, agentId, missionId: a.missions[0].id,
          title: a.missions[0].title,
          why: d.title + ' — ' + (d.need - d.have) + ' to go',
          xp: d.xp
        });
      }
    });

    // 2. The agent you have never touched.
    const untouched = open.filter(id => !s.agentRuns[id]);
    if (untouched.length && out.length < 3) {
      const a = P.agents.byId[untouched[0]];
      out.push({
        tag: 'first contact', hue: a.hue, agentId: a.id, missionId: a.missions[0].id,
        title: a.name + ' · ' + a.missions[0].title,
        why: a.line,
        xp: (a.missions[0].xp || 40) + 30
      });
    }

    // 3. The mastery tier you are closest to cracking.
    if (out.length < 3) {
      const near = open
        .map(id => ({ id, runs: s.agentRuns[id] || 0 }))
        .filter(x => x.runs > 0 && P.agents.masteryOf(x.runs) < 5)
        .sort((a, b) => P.agents.masteryProgress(b.runs) - P.agents.masteryProgress(a.runs))[0];
      if (near) {
        const a = P.agents.byId[near.id];
        const m = P.agents.masteryOf(near.runs);
        const togo = P.agents.MASTERY_STEPS[m + 1] - near.runs;
        out.push({
          tag: 'mastery', hue: a.hue, agentId: a.id,
          missionId: a.missions[Math.min(1, a.missions.length - 1)].id,
          title: a.name + ' → ' + P.agents.MASTERY_NAMES[m + 1],
          why: togo + ' more run' + (togo === 1 ? '' : 's') + ' to the next tier',
          xp: a.missions[0].xp || 40
        });
      }
    }

    // 4. Fill any gap with the nearest locked agent as a carrot.
    if (out.length < 3) {
      const locked = P.agents.list.filter(a => open.indexOf(a.id) === -1)
        .sort((a, b) => a.unlock.level - b.unlock.level)[0];
      if (locked) {
        const st = standing(s);
        out.push({
          tag: 'locked', hue: locked.hue, locked: true,
          title: locked.name + ' · ' + locked.role,
          why: 'Unlocks at level ' + locked.unlock.level + ' — ' + st.toNext + ' XP to level ' + (s.level + 1),
          xp: 0
        });
      }
    }

    // 5. Last resort: a solid default.
    while (out.length < 3) {
      const a = P.agents.byId[open[out.length % open.length]];
      const m = a.missions[0];
      out.push({ tag: 'try', hue: a.hue, agentId: a.id, missionId: m.id, title: a.name + ' · ' + m.title, why: m.gives, xp: m.xp });
    }

    return out.slice(0, 3);
  }

  return {
    RANKS, need, totalFor, rankFor, standing,
    unlockedIds, isUnlocked,
    chainBump, chainState, onChain, CHAIN_MAX,
    touchDay, directives, advanceQuests,
    award, checkAchievements, recordRun, recordSide,
    suggestions, on
  };
})();


/* ── js/ui/fx.js ── */
/* ══════════════════════════════════════════════════════════════
   PRISM · fx — the holography

   Two canvases: a fixed volumetric field behind everything, and a
   prism/dispersion layer behind the facet grid. Plus pointer tilt,
   specular tracking, and optional WebAudio blips.

   Everything here is decorative and self-disabling: reduced motion,
   a hidden tab, or a motion:off preference stops the loops dead.
   ══════════════════════════════════════════════════════════════ */

P.fx = (function () {
  'use strict';

  const U = P.util;

  let running = false;
  let raf = null;
  const pointer = { x: 0.5, y: 0.4, tx: 0.5, ty: 0.4 };

  const enabled = () => P.store.get().prefs.motion && !U.reduceMotion();

  /* ══════════════════════════════════════════════════════════
     Field — drifting light shards behind the whole page
     ══════════════════════════════════════════════════════════ */

  const field = { cv: null, ctx: null, w: 0, h: 0, dpr: 1, shards: [], motes: [] };

  function sizeField() {
    const c = field.cv;
    if (!c) return;
    field.dpr = Math.min(2, window.devicePixelRatio || 1);
    field.w = c.clientWidth;
    field.h = c.clientHeight;
    c.width = Math.floor(field.w * field.dpr);
    c.height = Math.floor(field.h * field.dpr);
    field.ctx.setTransform(field.dpr, 0, 0, field.dpr, 0, 0);
  }

  function seedField() {
    const r = U.rng('prism-field');
    const count = window.innerWidth < 700 ? 5 : 9;

    field.shards = Array.from({ length: count }, () => ({
      x: r(), y: r(),
      len: 0.16 + r() * 0.42,
      ang: -0.9 + r() * 1.8,
      hue: [190, 205, 265, 300, 315][Math.floor(r() * 5)],
      speed: 0.00004 + r() * 0.00011,
      width: 40 + r() * 130,
      alpha: 0.05 + r() * 0.09,
      phase: r() * Math.PI * 2
    }));

    field.motes = Array.from({ length: window.innerWidth < 700 ? 22 : 46 }, () => ({
      x: r(), y: r(),
      vy: -0.00004 - r() * 0.00012,
      vx: (r() - 0.5) * 0.00006,
      r: 0.4 + r() * 1.5,
      hue: 180 + r() * 140,
      alpha: 0.14 + r() * 0.4,
      tw: r() * Math.PI * 2
    }));
  }

  function drawField(t) {
    const { ctx, w, h } = field;
    if (!ctx) return;
    ctx.clearRect(0, 0, w, h);

    // Parallax: the field leans away from the pointer very slightly.
    const px = (pointer.x - 0.5) * 26;
    const py = (pointer.y - 0.5) * 18;

    ctx.globalCompositeOperation = 'lighter';

    // Light shards — long soft diagonal beams.
    field.shards.forEach(s => {
      const drift = (t * s.speed) % 1.4 - 0.2;
      const x = (s.x + drift) * w - px;
      const y = s.y * h + Math.sin(t * 0.0002 + s.phase) * 22 - py;
      const dx = Math.cos(s.ang) * s.len * w;
      const dy = Math.sin(s.ang) * s.len * h;

      const g = ctx.createLinearGradient(x, y, x + dx, y + dy);
      const a = s.alpha * (0.6 + 0.4 * Math.sin(t * 0.0004 + s.phase));
      g.addColorStop(0,   'hsla(' + s.hue + ', 100%, 68%, 0)');
      g.addColorStop(0.5, 'hsla(' + s.hue + ', 100%, 68%, ' + a.toFixed(3) + ')');
      g.addColorStop(1,   'hsla(' + s.hue + ', 100%, 68%, 0)');

      ctx.strokeStyle = g;
      ctx.lineWidth = s.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + dx, y + dy);
      ctx.stroke();
    });

    // Motes — slow rising dust, twinkling.
    field.motes.forEach(m => {
      m.x += m.vx; m.y += m.vy;
      if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); }
      if (m.x < -0.05) m.x = 1.05;
      if (m.x > 1.05)  m.x = -0.05;

      const tw = 0.55 + 0.45 * Math.sin(t * 0.0016 + m.tw);
      ctx.fillStyle = 'hsla(' + m.hue + ', 100%, 76%, ' + (m.alpha * tw).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(m.x * w - px * 0.4, m.y * h - py * 0.4, m.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ══════════════════════════════════════════════════════════
     Prism — the beam splitting behind the facet grid
     ══════════════════════════════════════════════════════════ */

  const prism = { cv: null, ctx: null, w: 0, h: 0, dpr: 1, hues: [] };

  function sizePrism() {
    const c = prism.cv;
    if (!c) return;
    prism.dpr = Math.min(2, window.devicePixelRatio || 1);
    prism.w = c.clientWidth;
    prism.h = c.clientHeight;
    c.width = Math.floor(prism.w * prism.dpr);
    c.height = Math.floor(prism.h * prism.dpr);
    prism.ctx.setTransform(prism.dpr, 0, 0, prism.dpr, 0, 0);
  }

  /** Tell the prism which hues to disperse — the unlocked agents. */
  function setSpectrum(hues) { prism.hues = hues.slice(); }

  function drawPrism(t) {
    const { ctx, w, h } = prism;
    if (!ctx || !w) return;
    ctx.clearRect(0, 0, w, h);
    if (!prism.hues.length) return;

    const ox = w * 0.5, oy = -h * 0.08;   // apex just above the grid
    ctx.globalCompositeOperation = 'lighter';

    // Incoming white beam.
    const beam = ctx.createLinearGradient(ox, oy - 60, ox, oy + 30);
    beam.addColorStop(0, 'hsla(200, 100%, 90%, 0)');
    beam.addColorStop(1, 'hsla(200, 100%, 90%, ' + (0.16 + 0.06 * Math.sin(t * 0.001)).toFixed(3) + ')');
    ctx.strokeStyle = beam;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ox, oy - 60);
    ctx.lineTo(ox, oy + 24);
    ctx.stroke();

    // Dispersion fan — one ray per unlocked agent.
    const n = prism.hues.length;
    const spread = Math.PI * 0.78;
    const start = Math.PI / 2 - spread / 2;

    prism.hues.forEach((hue, idx) => {
      const frac = n === 1 ? 0.5 : idx / (n - 1);
      const ang = start + spread * frac + Math.sin(t * 0.0003 + idx) * 0.012;
      const len = h * 1.25;
      const x2 = ox + Math.cos(ang) * len;
      const y2 = oy + Math.sin(ang) * len;

      const pulse = 0.5 + 0.5 * Math.sin(t * 0.0009 + idx * 0.7);
      const g = ctx.createLinearGradient(ox, oy, x2, y2);
      g.addColorStop(0,    'hsla(' + hue + ', 100%, 78%, ' + (0.34 * (0.6 + pulse * 0.4)).toFixed(3) + ')');
      g.addColorStop(0.55, 'hsla(' + hue + ', 100%, 68%, ' + (0.13 * (0.6 + pulse * 0.4)).toFixed(3) + ')');
      g.addColorStop(1,    'hsla(' + hue + ', 100%, 60%, 0)');

      // Ray thickness has to scale with the canvas or a phone gets one
      // fat slab instead of a fan.
      const wide = Math.max(9, Math.min(30, w / n / 2.6));
      ctx.strokeStyle = g;
      ctx.lineWidth = wide + pulse * (wide * 0.35);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    });

    ctx.globalCompositeOperation = 'source-over';
  }

  /* ══════════════════════════════════════════════════════════
     Loop
     ══════════════════════════════════════════════════════════ */

  function frame(t) {
    // Ease the pointer so parallax glides instead of snapping.
    pointer.x += (pointer.tx - pointer.x) * 0.06;
    pointer.y += (pointer.ty - pointer.y) * 0.06;

    drawField(t);
    drawPrism(t);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (running || !enabled()) return;
    running = true;
    raf = requestAnimationFrame(frame);
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function refresh() {
    if (enabled()) { sizeField(); sizePrism(); start(); }
    else {
      stop();
      if (field.ctx) field.ctx.clearRect(0, 0, field.w, field.h);
      if (prism.ctx) prism.ctx.clearRect(0, 0, prism.w, prism.h);
    }
  }

  /* ══════════════════════════════════════════════════════════
     Pointer: parallax, tilt, specular
     ══════════════════════════════════════════════════════════ */

  const onPointer = U.throttle(e => {
    pointer.tx = e.clientX / window.innerWidth;
    pointer.ty = e.clientY / window.innerHeight;
  }, 32);

  /** Give a card 3D tilt + a sheen that tracks the cursor. */
  function bindTilt(node, strength) {
    const s = strength === undefined ? 7 : strength;

    node.addEventListener('pointermove', e => {
      if (!enabled()) return;
      const r = node.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;

      node.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      node.style.setProperty('--my', (py * 100).toFixed(1) + '%');

      node.classList.add('tilt--active');
      node.style.transform =
        'perspective(900px) rotateX(' + ((0.5 - py) * s).toFixed(2) + 'deg) ' +
        'rotateY(' + ((px - 0.5) * s).toFixed(2) + 'deg) translateZ(0)';
    });

    node.addEventListener('pointerleave', () => {
      node.classList.remove('tilt--active');
      node.style.transform = '';
    });

    node.classList.add('tilt');
    return node;
  }

  /* ══════════════════════════════════════════════════════════
     Sound — tiny synthesised blips, off by default
     ══════════════════════════════════════════════════════════ */

  let actx = null;

  function tone(freq, dur, type, gain) {
    if (!P.store.get().prefs.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();

      const osc = actx.createOscillator();
      const amp = actx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, actx.currentTime);

      const peak = gain === undefined ? 0.05 : gain;
      amp.gain.setValueAtTime(0.0001, actx.currentTime);
      amp.gain.exponentialRampToValueAtTime(peak, actx.currentTime + 0.012);
      amp.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);

      osc.connect(amp).connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + dur + 0.02);
    } catch (_) { /* audio is a nicety, never a failure */ }
  }

  const sfx = {
    tap:     () => tone(680, 0.06, 'sine', 0.035),
    open:    () => { tone(420, 0.09, 'triangle', 0.04); setTimeout(() => tone(640, 0.10, 'triangle', 0.03), 55); },
    run:     () => { tone(300, 0.12, 'sawtooth', 0.022); setTimeout(() => tone(600, 0.14, 'sine', 0.03), 70); },
    done:    () => { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'sine', 0.036), i * 70)); },
    reward:  () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.04), i * 85)); },
    error:   () => { tone(180, 0.18, 'square', 0.03); }
  };

  /* ══════════════════════════════════════════════════════════
     Boot
     ══════════════════════════════════════════════════════════ */

  function init() {
    field.cv = document.getElementById('fx-field');
    if (field.cv) { field.ctx = field.cv.getContext('2d'); sizeField(); seedField(); }

    prism.cv = document.getElementById('fx-prism');
    if (prism.cv) { prism.ctx = prism.cv.getContext('2d'); sizePrism(); }

    window.addEventListener('resize', U.throttle(() => { sizeField(); sizePrism(); }, 180));
    window.addEventListener('pointermove', onPointer, { passive: true });

    // Do not burn a phone battery animating a tab nobody is looking at.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop(); else refresh();
    });

    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq.addEventListener) mq.addEventListener('change', refresh);

    refresh();
  }

  return { init, start, stop, refresh, bindTilt, setSpectrum, sizePrism, sfx, tone, enabled };
})();


/* ── js/ui/views.js ── */
/* ══════════════════════════════════════════════════════════════
   PRISM · views — every screen, and the output renderer
   ══════════════════════════════════════════════════════════════ */

P.views = (function () {
  'use strict';

  const U = P.util, S = P.store, PR = P.progress, A = P.agents;
  const { el, frag, clear } = U;

  const sigil = (agent, cls) => {
    const wrap = el('div.' + cls);
    wrap.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + agent.sigil + '</svg>';
    return wrap;
  };

  /* ══════════════════════════════════════════════════════════
     Output renderer — a document → a holocard
     ══════════════════════════════════════════════════════════ */

  function renderBlock(b) {
    if (b.t === 'note') return el('div.blk', el('p', b.text));

    if (b.t === 'quote') {
      return el('div.blk',
        b.h ? el('div.blk__h', b.h) : null,
        el('div.quote', b.text));
    }

    if (b.t === 'list') {
      const items = (b.items || []).map((it, i) =>
        typeof it === 'string'
          ? el('li', b.ordered ? el('span.n', String(i + 1)) : el('span.n', '•'), el('span', it))
          : el('li', el('span.n', String(i + 1)), el('span', el('b', it.b + ' '), it.text))
      );
      return el('div.blk',
        b.h ? el('div.blk__h', b.h) : null,
        el(b.ordered ? 'ol' : 'ul', {}, items));
    }

    if (b.t === 'steps') {
      const items = (b.items || []).map((it, i) =>
        el('li', el('span.n', String(i + 1)),
           el('span', it.b ? el('b', it.b + ' — ') : null, it.text))
      );
      return el('div.blk',
        b.h ? el('div.blk__h', b.h) : null,
        el('ol', {}, items));
    }

    if (b.t === 'stats') {
      const cards = (b.items || []).map(it =>
        el('div.kv__c',
          el('div.kv__k', it.k),
          el('div.kv__v', it.v),
          it.n ? el('div.kv__n', it.n) : null));
      return el('div.blk',
        b.h ? el('div.blk__h', b.h) : null,
        el('div.kv', {}, cards));
    }

    if (b.t === 'tags') {
      return el('div.blk',
        b.h ? el('div.blk__h', b.h) : null,
        el('div.tags', {}, (b.items || []).map(x => el('span.tag', x))));
    }

    return el('div.blk', el('p', JSON.stringify(b)));
  }

  /**
   * Build the output card. `ctx` carries what the action bar needs
   * to copy, refine and archive.
   */
  function renderOutput(doc, ctx) {
    const body = el('div.out__body.reveal', {}, doc.blocks.map(renderBlock));
    U.stagger(body);

    const bar = el('div.out__bar',
      el('span.out__dot'),
      el('span', doc.live ? 'live · ' + (S.get().prefs.model || 'claude') : 'composed'),
      el('span.spacer'),
      el('button.out__act', { type: 'button', 'data-act': 'copy' }, 'Copy'),
      el('button.out__act', { type: 'button', 'data-act': 'save' }, 'Save')
    );

    const refine = el('div.refine',
      el('span.refine__lbl', 'Refine'),
      ...[
        ['shorter', 'Shorter'],
        ['bolder', 'Bolder'],
        ['specific', 'More specific'],
        ['angle', 'Different angle']
      ].map(([k, label]) => el('button.pill', { type: 'button', 'data-refine': k }, label))
    );

    const card = el('div.out.materialise', bar, body,
      ctx.onRefine ? el('div', { style: { padding: '0 22px 20px' } }, refine) : null);

    bar.addEventListener('click', async e => {
      const act = e.target.getAttribute && e.target.getAttribute('data-act');
      if (!act) return;

      if (act === 'copy') {
        const ok = await U.copy(P.compose.toText(doc));
        P.fx.sfx.tap();
        if (ok) {
          const res = PR.recordSide('copy');
          P.app.celebrate(res);
          P.app.toast('Copied to your clipboard', '⧉');
        } else {
          P.app.toast('Could not reach the clipboard — select and copy manually', '!');
        }
      }

      if (act === 'save') {
        P.app.archive(doc, ctx);
        P.fx.sfx.tap();
        P.app.toast('Saved to your archive', '▤');
      }
    });

    refine.addEventListener('click', e => {
      const mod = e.target.getAttribute && e.target.getAttribute('data-refine');
      if (mod && ctx.onRefine) ctx.onRefine(mod);
    });

    return card;
  }

  /* ══════════════════════════════════════════════════════════
     Deck
     ══════════════════════════════════════════════════════════ */

  function facetCard(agent, state) {
    const open = PR.isUnlocked(agent.id, state);
    const runs = state.agentRuns[agent.id] || 0;
    const mast = A.masteryOf(runs);

    const card = el('button.facet.holo.holo--live', {
      type: 'button',
      role: 'listitem',
      style: { '--hue': agent.hue },
      'data-agent': agent.id,
      'aria-label': agent.name + ' — ' + agent.role + (open ? '' : ' (locked)')
    },
      sigil(agent, 'facet__sigil'),
      el('div',
        el('div.facet__name', agent.name),
        el('div.facet__role', agent.role)),
      el('div.facet__foot',
        el('span', open ? (runs ? runs + ' run' + (runs === 1 ? '' : 's') : 'untouched') : 'sealed'),
        el('span.pips', {}, [0, 1, 2, 3, 4].map(i => el('i.pip' + (i < mast ? '.pip--on' : ''))))
      )
    );

    if (!open) {
      card.classList.add('is-locked');
      card.disabled = true;
      card.append(el('div.facet__lock',
        el('b', '◈'),
        el('span.facet__lockname', agent.name),
        el('span', 'Level ' + agent.unlock.level)));
    } else {
      P.fx.bindTilt(card, 8);
    }

    return card;
  }

  function renderDeck() {
    const state = S.get();
    const open = PR.unlockedIds(state);

    // Greeting shifts with progress so the deck never feels static.
    const greet = U.$('#deck-greeting');
    if (greet) {
      const st = PR.standing(state);
      greet.textContent = state.runs === 0
        ? 'Split your intent into a spectrum.'
        : state.streak > 1
          ? 'Day ' + state.streak + '. The beam is still on.'
          : st.pct > 0.7
            ? 'Nearly ' + PR.rankFor(state.level + 1) + '. ' + st.toNext + ' XP to go.'
            : 'Welcome back, ' + st.rank + '.';
    }

    // Facets
    const grid = U.$('#facets');
    clear(grid);
    A.list.forEach(a => grid.append(facetCard(a, state)));

    P.fx.setSpectrum(A.list.filter(a => open.indexOf(a.id) !== -1).map(a => a.hue));
    P.fx.sizePrism();

    // Beam hints — real examples that route somewhere
    const hints = U.$('#beam-hints');
    clear(hints);
    P.engine.hints('hints-' + U.dayKey() + '-' + open.length).forEach(h => {
      hints.append(el('button.hint', { type: 'button', 'data-hint': h.q }, h.q));
    });

    // Next best moves
    const next = U.$('#next-moves');
    clear(next);
    PR.suggestions().forEach(s => {
      const card = el('button.nextcard', {
        type: 'button',
        style: { '--hue': s.hue },
        'data-agent': s.agentId || '',
        'data-mission': s.missionId || '',
        disabled: s.locked || false
      },
        el('div.nextcard__tag', s.tag),
        el('div.nextcard__title', s.title),
        el('div.nextcard__why', s.why),
        s.xp ? el('div.nextcard__xp', '+' + s.xp + ' XP') : null
      );
      if (s.locked) card.classList.add('is-locked');
      next.append(card);
    });
  }

  /* ══════════════════════════════════════════════════════════
     Agent view
     ══════════════════════════════════════════════════════════ */

  function fieldControl(f, mission, agent) {
    const id = 'f-' + agent.id + '-' + mission.id + '-' + f.k;

    const label = el('label.field__label', { for: id },
      el('span', f.label),
      f.ex && f.ex.length
        ? el('button.field__dice', { type: 'button', 'data-ex': f.k, tabindex: '-1' }, 'example')
        : null
    );

    let control;

    if (f.type === 'area') {
      control = el('textarea.textarea', { id, placeholder: f.ph || '', 'data-k': f.k, rows: '3' });

    } else if (f.type === 'select') {
      control = el('select.select', { id, 'data-k': f.k },
        ...(f.options || []).map(o => el('option', { value: o, selected: o === f.def }, o)));

    } else if (f.type === 'pills') {
      control = el('div.pillrow', { 'data-k': f.k, role: 'group', 'aria-label': f.label },
        ...(f.options || []).map(o =>
          el('button.pill', {
            type: 'button', 'data-val': o,
            'aria-pressed': o === (f.def || f.options[0]) ? 'true' : 'false'
          }, o)));

      control.addEventListener('click', e => {
        const v = e.target.getAttribute && e.target.getAttribute('data-val');
        if (!v) return;
        U.$$('.pill', control).forEach(p => p.setAttribute('aria-pressed', String(p === e.target)));
        P.fx.sfx.tap();
      });

    } else {
      control = el('input.input', {
        id, type: f.type === 'number' ? 'number' : 'text',
        inputmode: f.type === 'number' ? 'decimal' : null,
        placeholder: f.ph || '', 'data-k': f.k
      });
    }

    const wrap = el('div.field', label, control);

    const dice = U.$('.field__dice', wrap);
    if (dice) {
      dice.addEventListener('click', () => {
        const v = U.pick(f.ex);
        if (control.tagName === 'INPUT' || control.tagName === 'TEXTAREA') control.value = v;
        control.classList.add('glitch');
        setTimeout(() => control.classList.remove('glitch'), 340);
        P.fx.sfx.tap();
      });
    }

    return wrap;
  }

  /** Read every control in a mission body into a plain object. */
  function readInputs(body) {
    const out = {};
    U.$$('[data-k]', body).forEach(node => {
      const k = node.getAttribute('data-k');
      if (node.classList.contains('pillrow')) {
        const on = U.$('.pill[aria-pressed="true"]', node);
        out[k] = on ? on.getAttribute('data-val') : '';
      } else {
        out[k] = node.value;
      }
    });
    return out;
  }

  function missionPanel(agent, mission, idx) {
    const details = el('details.mission.holo', { style: { '--hue': agent.hue }, 'data-mission': mission.id });

    const summary = el('summary.mission__head',
      el('span.mission__idx', mission.locked ? '◈' : String(idx + 1)),
      el('div.mission__text',
        el('div.mission__title', mission.title),
        el('div.mission__gives', mission.locked ? 'Sealed — reach ' + mission.lockNote : mission.gives)),
      el('span.mission__chev', '❯')
    );
    details.append(summary);

    if (mission.locked) {
      details.classList.add('is-locked');
      summary.addEventListener('click', e => {
        e.preventDefault();
        P.app.toast('Sealed until ' + mission.lockNote.toLowerCase(), '◈');
        P.fx.sfx.error();
      });
      return details;
    }

    const body = el('div.mission__body');
    mission.fields.forEach(f => body.append(fieldControl(f, mission, agent)));

    const runBtn = el('button.btn.btn--go', { type: 'button' }, 'Run mission');
    const meta = el('span.runbar__meta', '+' + (mission.xp || 40) + ' XP');
    const clearBtn = el('button.btn.btn--ghost', { type: 'button' }, 'Clear');

    body.append(el('div.runbar', runBtn, clearBtn, meta));

    const slot = el('div');
    body.append(slot);
    details.append(body);

    let controller = null;

    async function go(mod) {
      const inputs = readInputs(body);

      // A mission with nothing in it produces nothing useful.
      const filled = mission.fields.some(f => String(inputs[f.k] || '').trim());
      if (!filled) {
        P.app.toast('Fill in at least one field — or hit "example"', '!');
        P.fx.sfx.error();
        U.$('.input, .textarea', body) && U.$('.input, .textarea', body).focus();
        return;
      }

      runBtn.disabled = true;
      runBtn.textContent = mod ? 'Refining…' : 'Refracting…';
      P.fx.sfx.run();

      clear(slot);
      const live = P.engine.linkReady();
      const thinkBox = live ? el('div.think', 'connecting…') : null;
      if (thinkBox) slot.append(el('div.out.materialise', el('div.out__body', thinkBox)));

      if (controller) controller.abort();
      controller = new AbortController();

      let result;
      try {
        result = await P.engine.produce(agent.id, mission.id, inputs, {
          mod,
          signal: controller.signal,
          onThinking: t => { if (thinkBox) thinkBox.textContent = t.slice(-900); },
          onText: t => { if (thinkBox) thinkBox.textContent = t.slice(-900); }
        });
      } catch (err) {
        if (err.name === 'AbortError') return;
        result = { doc: P.compose.run(agent.id, mission.id, inputs, mod), live: false };
      }

      clear(slot);

      const ctx = {
        agentId: agent.id, missionId: mission.id, inputs,
        onRefine: m => {
          const res = PR.recordSide('refine');
          P.app.celebrate(res);
          go(m);
        }
      };

      slot.append(renderOutput(result.doc, ctx));

      runBtn.disabled = false;
      runBtn.textContent = 'Run again';
      P.fx.sfx.done();

      // Refines are paid for by recordSide; only a fresh run scores a mission.
      if (!mod) {
        const gain = PR.recordRun(agent.id, mission, { live: result.live, viaBeam: !!details.dataset.viaBeam });
        delete details.dataset.viaBeam;
        P.app.celebrate(gain);
        P.app.archive(result.doc, ctx);
      }

      slot.scrollIntoView({ behavior: U.reduceMotion() ? 'auto' : 'smooth', block: 'nearest' });
    }

    runBtn.addEventListener('click', () => go(null));
    clearBtn.addEventListener('click', () => {
      U.$$('[data-k]', body).forEach(nd => { if (nd.value !== undefined) nd.value = ''; });
      clear(slot);
      runBtn.textContent = 'Run mission';
    });

    details.addEventListener('toggle', () => { if (details.open) P.fx.sfx.open(); });

    details._prism = { go, body, runBtn };
    return details;
  }

  function renderAgent(agentId, opts) {
    const o = opts || {};
    const agent = A.byId[agentId];
    const view = U.$('#view-agent');
    clear(view);
    if (!agent) return;

    const state = S.get();
    const runs = state.agentRuns[agentId] || 0;
    const mast = A.masteryOf(runs);
    const prog = A.masteryProgress(runs);

    view.style.setProperty('--hue', agent.hue);
    document.documentElement.style.setProperty('--hue', agent.hue);

    const back = el('button.backlink', { type: 'button', 'data-nav': 'deck' }, '❮', 'All facets');

    const idcard = el('aside.idcard.holo.holo--live', { style: { '--hue': agent.hue } },
      el('div.idcard__top',
        sigil(agent, 'idcard__sigil'),
        el('div',
          el('div.idcard__name', agent.name),
          el('div.idcard__role', agent.role))),
      el('p.idcard__line', agent.line),
      el('div',
        el('div.section-title', el('span', 'Good at')),
        el('ul.goodat', {}, agent.goodAt.map(g => el('li', g)))),
      el('div.mastery',
        el('div.mastery__row',
          el('span', 'Mastery'),
          el('b', A.MASTERY_NAMES[mast])),
        el('div.bar', el('i', { style: { width: (prog * 100).toFixed(0) + '%' } })),
        el('div.mastery__row',
          el('span', runs + ' run' + (runs === 1 ? '' : 's')),
          el('span', mast >= 5 ? 'maxed' : (A.MASTERY_STEPS[mast + 1] - runs) + ' to next')))
    );
    P.fx.bindTilt(idcard, 4);

    const missions = A.missionsFor(agent, runs);
    const list = el('div.missions', {}, missions.map((m, i) => missionPanel(agent, m, i)));

    view.append(back, el('div.agent', idcard, el('div', el('div.section-title', el('span', 'Missions')), list)));

    // Deep link: open a mission, optionally pre-filled from the beam.
    if (o.missionId) {
      const target = U.$('[data-mission="' + o.missionId + '"]', list);
      if (target && !target.classList.contains('is-locked')) {
        target.open = true;
        if (o.prefill) {
          Object.keys(o.prefill).forEach(k => {
            const nd = U.$('[data-k="' + k + '"]', target);
            if (nd && nd.value !== undefined) nd.value = o.prefill[k];
          });
          target.dataset.viaBeam = '1';
        }
        setTimeout(() => target.scrollIntoView({ behavior: U.reduceMotion() ? 'auto' : 'smooth', block: 'center' }), 120);
        if (o.autorun && target._prism) setTimeout(() => target._prism.go(null), 420);
      }
    }
  }

  /* ══════════════════════════════════════════════════════════
     Progress
     ══════════════════════════════════════════════════════════ */

  function renderProgress() {
    const view = U.$('#view-progress');
    clear(view);
    const s = S.get();
    const st = PR.standing(s);

    document.documentElement.style.setProperty('--hue', 190);

    const uniq = Object.keys(s.agentRuns).length;
    const topId = Object.keys(s.agentRuns).sort((a, b) => s.agentRuns[b] - s.agentRuns[a])[0];

    const head = el('div.deck__head',
      el('p.eyebrow', 'progress'),
      el('h2.display', st.rank),
      el('p.lede', 'Level ' + st.level + ' · ' + st.into + ' / ' + st.span +
        ' XP toward ' + PR.rankFor(st.level + 1) + '. ' +
        (s.streak > 1 ? 'A ' + s.streak + '-day streak is running.' : 'Run one mission today to start a streak.')));

    const grid = el('div.pgrid',
      el('div.stat.holo', el('div.stat__k', 'Missions run'), el('div.stat__v', U.fmt(s.runs)), el('div.stat__n', 'all time')),
      el('div.stat.holo', el('div.stat__k', 'Streak'), el('div.stat__v', String(s.streak)), el('div.stat__n', 'best ' + s.bestStreak + ' days')),
      el('div.stat.holo', el('div.stat__k', 'Facets used'), el('div.stat__v', uniq + '/' + A.list.length), el('div.stat__n', topId ? 'most: ' + A.byId[topId].name : 'none yet')),
      el('div.stat.holo', el('div.stat__k', 'Total XP'), el('div.stat__v', U.fmt(s.xp)), el('div.stat__n', st.toNext + ' to next level'))
    );

    // Directives
    const ds = PR.directives();
    const qlist = el('div.qlist', {}, ds.map(d =>
      el('div.quest', { 'data-done': d.done ? '1' : '0' },
        el('div.quest__tick', '✔'),
        el('div.quest__t', el('b', d.title), el('span', d.note)),
        el('div.quest__p', d.have + '/' + d.need),
        el('div.quest__xp', '+' + d.xp))
    ));

    // Mastery per agent
    const open = PR.unlockedIds(s);
    const mastery = el('div.qlist', {}, A.list.filter(a => open.indexOf(a.id) !== -1).map(a => {
      const runs = s.agentRuns[a.id] || 0;
      const m = A.masteryOf(runs);
      return el('div.quest', { style: { '--hue': a.hue } },
        el('span.pips', {}, [0, 1, 2, 3, 4].map(i => el('i.pip' + (i < m ? '.pip--on' : '')))),
        el('div.quest__t', el('b', a.name), el('span', A.MASTERY_NAMES[m] + ' · ' + a.role)),
        el('div.quest__p', runs + ' run' + (runs === 1 ? '' : 's')));
    }));

    // Badges
    const badges = el('div.badges', {}, P.quests.ACHIEVEMENTS.map(a => {
      const got = s.achievements.indexOf(a.id) !== -1;
      return el('div.badge', { 'data-got': got ? '1' : '0', style: { '--hue': a.hue } },
        el('div.badge__ico', a.ico),
        el('div.badge__n', a.name),
        el('div.badge__d', got ? a.desc : 'Locked'));
    }));

    const got = s.achievements.length;

    view.append(head, grid,
      el('div.stack',
        el('div', el('div.section-title', el('span', "Today's directives")), qlist),
        el('div', el('div.section-title', el('span', 'Agent mastery')), mastery),
        el('div', el('div.section-title', el('span', 'Badges · ' + got + ' of ' + P.quests.ACHIEVEMENTS.length)), badges)));
  }

  /* ══════════════════════════════════════════════════════════
     Archive
     ══════════════════════════════════════════════════════════ */

  function renderArchive() {
    const view = U.$('#view-archive');
    clear(view);
    const s = S.get();

    document.documentElement.style.setProperty('--hue', 190);

    const head = el('div.deck__head',
      el('p.eyebrow', 'archive'),
      el('h2.display', 'Everything you have made'),
      el('p.lede', 'The last ' + Math.min(s.archive.length, 60) + ' outputs, newest first. Click one to read it again.'));

    view.append(head);

    if (!s.archive.length) {
      view.append(el('div.empty', el('b', 'Nothing here yet'), 'Run a mission and it lands here automatically.'));
      return;
    }

    const rows = el('div.arc', {}, s.archive.map((entry, i) => {
      const agent = A.byId[entry.agentId];
      return el('button.arcrow', {
        type: 'button', 'data-idx': i,
        style: { '--hue': agent ? agent.hue : 190 }
      },
        el('span.arcrow__dot'),
        el('div.arcrow__m',
          el('b', (agent ? agent.name + ' · ' : '') + entry.title),
          el('span', entry.subtitle || '')),
        el('span.arcrow__t', U.ago(entry.at)));
    }));

    rows.addEventListener('click', e => {
      const btn = e.target.closest && e.target.closest('.arcrow');
      if (!btn) return;
      const entry = S.get().archive[parseInt(btn.getAttribute('data-idx'), 10)];
      if (!entry) return;
      P.app.modal(
        entry.title,
        entry.subtitle || '',
        renderOutput(entry.doc, { agentId: entry.agentId, missionId: entry.missionId, inputs: entry.inputs })
      );
    });

    view.append(rows);
  }

  /* ══════════════════════════════════════════════════════════
     Settings
     ══════════════════════════════════════════════════════════ */

  function toggleRow(title, note, key, onChange) {
    const on = !!S.get().prefs[key];
    const sw = el('button.switch', { type: 'button', role: 'switch', 'aria-checked': String(on), 'aria-label': title });
    sw.addEventListener('click', () => {
      const next = sw.getAttribute('aria-checked') !== 'true';
      sw.setAttribute('aria-checked', String(next));
      S.update(s => { s.prefs[key] = next; });
      P.fx.sfx.tap();
      if (onChange) onChange(next);
    });
    return el('div.toggle', el('div.toggle__t', el('b', title), el('span', note)), sw);
  }

  function renderSettings() {
    const view = U.$('#view-settings');
    clear(view);
    const p = S.get().prefs;

    document.documentElement.style.setProperty('--hue', 190);

    const head = el('div.deck__head',
      el('p.eyebrow', 'settings'),
      el('h2.display', 'Tune the deck'),
      el('p.lede', 'PRISM works completely offline. Everything below is optional.'));

    /* ── display ── */
    const display = el('div.setcard.holo',
      el('h3', 'Display & feel'),
      toggleRow('Motion', 'Holographic field, tilt and parallax.', 'motion', () => P.fx.refresh()),
      toggleRow('Sound', 'Small synthesised blips on actions. Off by default.', 'sound', on => { if (on) P.fx.sfx.done(); })
    );

    /* ── live link ── */
    const modeSel = el('select.select', { 'aria-label': 'Live link mode' },
      el('option', { value: 'proxy', selected: p.linkMode === 'proxy' }, 'Proxy endpoint (recommended)'),
      el('option', { value: 'direct', selected: p.linkMode === 'direct' }, 'Direct — key stored in this browser'));

    const endpoint = el('input.input', {
      type: 'url', value: p.endpoint || '',
      placeholder: 'https://your-worker.example.com/prism'
    });

    const apiKey = el('input.input', {
      type: 'password', value: p.apiKey || '',
      placeholder: 'sk-ant-…', autocomplete: 'off', spellcheck: 'false'
    });

    const model = el('select.select', { 'aria-label': 'Model' },
      ...['claude-opus-5', 'claude-sonnet-5', 'claude-haiku-4-5']
        .map(m => el('option', { value: m, selected: p.model === m }, m)));

    const proxyField = el('div.field', el('label.field__label', el('span', 'Your endpoint URL')), endpoint);
    const keyField = el('div.field', el('label.field__label', el('span', 'Anthropic API key')), apiKey);
    const warn = el('p', { style: { color: 'var(--rose)' } },
      'A key here is readable by anything with access to this browser profile. Use it on your own machine only — never on a shared or public computer. The proxy option keeps the key on a server instead.');

    function syncMode() {
      const direct = modeSel.value === 'direct';
      proxyField.hidden = direct;
      keyField.hidden = !direct;
      warn.hidden = !direct;
    }
    modeSel.addEventListener('change', syncMode);
    syncMode();

    const save = el('button.btn.btn--go', { type: 'button' }, 'Save link');
    const test = el('button.btn.btn--ghost', { type: 'button' }, 'Test it');

    save.addEventListener('click', () => {
      S.update(s => {
        s.prefs.linkMode = modeSel.value;
        s.prefs.endpoint = endpoint.value.trim();
        s.prefs.apiKey = apiKey.value.trim();
        s.prefs.model = model.value;
        s.prefs.liveLink = !!(modeSel.value === 'proxy' ? s.prefs.endpoint : s.prefs.apiKey);
      });
      const on = P.engine.linkReady();
      P.app.toast(on ? 'Live link armed' : 'Live link off — missing endpoint or key', on ? '⌁' : '!');
      if (on) {
        PR.checkAchievements({ live: true });
        P.fx.sfx.reward();
      }
    });

    test.addEventListener('click', async () => {
      if (!P.engine.linkReady()) { P.app.toast('Save the link first', '!'); return; }
      test.disabled = true; test.textContent = 'Testing…';
      try {
        const agent = A.byId.atlas;
        await P.engine.live({
          agent, mission: agent.missions[1],
          inputs: { focus: 'confirm the link works', load: 'Wide open' }
        });
        P.app.toast('Live link answered', '⌁');
        P.fx.sfx.done();
      } catch (err) {
        P.app.toast(err.message.slice(0, 90), '!');
        P.fx.sfx.error();
      }
      test.disabled = false; test.textContent = 'Test it';
    });

    const link = el('div.setcard.holo',
      el('h3', 'Live link'),
      el('p', 'Off by default. PRISM composes everything locally with no network at all — the live link swaps that for a real Claude response, shaped by the same mission brief. Missions, XP and the archive work identically either way.'),
      el('div.field', el('label.field__label', el('span', 'How to connect')), modeSel),
      proxyField, keyField, warn,
      el('div.field', el('label.field__label', el('span', 'Model')), model),
      el('div.row', save, test,
        el('span.runbar__meta', P.engine.linkReady() ? 'status: armed' : 'status: local only'))
    );

    /* ── data ── */
    const exportBtn = el('button.btn.btn--ghost', { type: 'button' }, 'Export save');
    const importBtn = el('button.btn.btn--ghost', { type: 'button' }, 'Import save');
    const resetBtn = el('button.btn.btn--ghost.danger', { type: 'button' }, 'Erase everything');

    exportBtn.addEventListener('click', async () => {
      const ok = await U.copy(S.export());
      P.app.toast(ok ? 'Save copied to clipboard' : 'Could not copy', ok ? '⧉' : '!');
    });

    importBtn.addEventListener('click', () => {
      const ta = el('textarea.textarea', { placeholder: 'Paste an exported PRISM save…', rows: '6' });
      P.app.modal('Import a save', 'This replaces everything currently on this device.', ta, [
        { label: 'Import', primary: true, act: () => {
            try { S.import(ta.value); P.app.toast('Save imported', '✔'); P.app.go('deck'); }
            catch (e) { P.app.toast('That is not a valid save file', '!'); }
          } }
      ]);
    });

    resetBtn.addEventListener('click', () => {
      P.app.modal('Erase everything?',
        'Your level, streak, badges and archive are all stored on this device only. This cannot be undone.',
        null,
        [{ label: 'Erase it all', danger: true, act: () => { S.reset(); P.app.toast('Deck wiped', '✔'); P.app.go('deck'); } }]);
    });

    const data = el('div.setcard.holo',
      el('h3', 'Your data'),
      el('p', 'Everything lives in this browser. Nothing is uploaded, and there is no account. ' +
        (S.isPersistent()
          ? 'Clearing site data will wipe it, so export a save if you care about the streak.'
          : 'Heads up: this browser is blocking storage, so progress will vanish when you close the tab.')),
      el('div.row', exportBtn, importBtn, resetBtn));

    view.append(head, el('div.setgrid', display, link, data));
  }

  return { renderDeck, renderAgent, renderProgress, renderArchive, renderSettings, renderOutput, renderBlock };
})();


/* ── js/app.js ── */
/* ══════════════════════════════════════════════════════════════
   PRISM · app — boot, routing, HUD, celebrations
   ══════════════════════════════════════════════════════════════ */

P.app = (function () {
  'use strict';

  const U = P.util, S = P.store, PR = P.progress, V = P.views;
  const { el, clear } = U;

  let current = 'deck';

  /* ══════════════════════════════════════════════════════════
     Transient UI
     ══════════════════════════════════════════════════════════ */

  function toast(text, ico) {
    const host = U.$('#toasts');
    const node = el('div.toast', el('span.toast__ico', ico || '◆'), el('span', text));
    host.append(node);
    setTimeout(() => {
      node.classList.add('toast--out');
      setTimeout(() => node.remove(), 400);
    }, 3200);
  }

  /** Big centre-screen pop for the things worth stopping for. */
  function pop(kicker, value, note, hue) {
    const host = U.$('#rewards');
    const node = el('div.pop', { style: { '--hue': hue || 190 } },
      el('div.pop__k', kicker),
      el('div.pop__v', value),
      note ? el('div.pop__n', note) : null);
    host.append(node);
    setTimeout(() => node.remove(), 2500);
  }

  /** Queue payouts so three things happening at once do not overlap. */
  const queue = [];
  let draining = false;

  function enqueue(fn, delay) {
    queue.push({ fn, delay: delay || 900 });
    if (!draining) drain();
  }

  async function drain() {
    draining = true;
    while (queue.length) {
      const job = queue.shift();
      job.fn();
      await U.wait(job.delay);
    }
    draining = false;
  }

  /**
   * Show everything a single action earned: XP, directives cleared,
   * levels gained, agents unlocked, badges. Order matters — smallest
   * first so the biggest reward lands last.
   */
  function celebrate(res) {
    if (!res) return;

    if (res.xp) {
      const chain = res.mult && res.mult > 1 ? ' ×' + res.mult.toFixed(1) : '';
      toast('+' + res.xp + ' XP' + chain, '✦');
    }

    (res.quests || []).forEach(q => {
      enqueue(() => {
        pop('directive cleared', q.title, '+' + q.xp + ' XP', 150);
        P.fx.sfx.reward();
      }, 1400);
    });

    (res.levelled || []).forEach(lv => {
      enqueue(() => {
        pop('level ' + lv, PR.rankFor(lv), 'rank advanced', 190);
        P.fx.sfx.reward();
      }, 1600);
    });

    (res.freshAgents || []).forEach(a => {
      enqueue(() => {
        pop('facet unsealed', a.name, a.role, a.hue);
        P.fx.sfx.reward();
        toast(a.name + ' is now on your deck', '◈');
      }, 1800);
    });

    (res.badges || []).forEach(b => {
      enqueue(() => {
        pop('badge', b.name, b.desc, b.hue);
        P.fx.sfx.reward();
      }, 1500);
    });

    syncHud();
    if ((res.freshAgents || []).length && current === 'deck') enqueue(() => V.renderDeck(), 100);
  }

  function modal(title, sub, node, actions) {
    const host = U.$('#modal');
    clear(host);
    host.hidden = false;

    const acts = el('div.modal__acts',
      el('button.btn.btn--ghost', { type: 'button', 'data-close': '1' }, 'Close'),
      ...(actions || []).map(a => {
        const b = el('button.btn' + (a.primary ? '.btn--go' : '.btn--ghost') + (a.danger ? '.danger' : ''),
          { type: 'button' }, a.label);
        b.addEventListener('click', () => { a.act(); close(); });
        return b;
      })
    );

    const box = el('div.modal__box.holo',
      el('h3', title),
      sub ? el('p', sub) : null,
      node || null,
      acts);

    function close() { host.hidden = true; clear(host); }

    host.append(box);
    host.addEventListener('click', e => {
      if (e.target === host || (e.target.getAttribute && e.target.getAttribute('data-close'))) close();
    });

    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
    });

    return close;
  }

  /* ══════════════════════════════════════════════════════════
     Archive
     ══════════════════════════════════════════════════════════ */

  function archive(doc, ctx) {
    S.update(s => {
      s.archive.unshift({
        at: Date.now(),
        agentId: ctx.agentId,
        missionId: ctx.missionId,
        title: doc.title,
        subtitle: doc.subtitle,
        inputs: ctx.inputs,
        doc
      });
      // Keep the save file small — sixty is well past what anyone scrolls.
      if (s.archive.length > 60) s.archive.length = 60;
    });
  }

  /* ══════════════════════════════════════════════════════════
     HUD
     ══════════════════════════════════════════════════════════ */

  function syncHud() {
    const s = S.get();
    const st = PR.standing(s);

    U.$('#hud-level').textContent = String(st.level);
    U.$('#hud-rankname').textContent = st.rank;
    U.$('#hud-xp').textContent = st.into + ' / ' + st.span + ' XP';
    U.$('#hud-ring').style.setProperty('--pct', st.pct.toFixed(3));

    U.$('#streak-n').textContent = String(s.streak);
    U.$('#hud-streak').setAttribute('data-hot', s.streak >= 3 ? '1' : '0');

    const ds = PR.directives();
    const done = ds.filter(d => d.done).length;
    U.$('#quest-n').textContent = done + '/' + ds.length;
    U.$('#hud-quests').setAttribute('data-done', done === ds.length && ds.length ? '1' : '0');
  }

  function syncChain(c) {
    const chip = U.$('#hud-combo');
    U.$('#combo-x').textContent = '×' + c.mult.toFixed(1);
    chip.setAttribute('data-live', c.live ? '1' : '0');
    U.$('#combo-decay').style.transform = 'scaleX(' + (c.live ? c.frac : 0).toFixed(3) + ')';
  }

  /* ══════════════════════════════════════════════════════════
     Routing
     ══════════════════════════════════════════════════════════ */

  const VIEWS = ['deck', 'agent', 'progress', 'archive', 'settings'];

  function go(view, opts) {
    const o = opts || {};
    if (VIEWS.indexOf(view) === -1) view = 'deck';
    current = view;

    VIEWS.forEach(v => { U.$('#view-' + v).hidden = v !== view; });
    U.$$('.hud__nav .iconbtn').forEach(b =>
      b.setAttribute('aria-current', String(b.getAttribute('data-nav') === view)));

    if (view !== 'agent') document.documentElement.style.setProperty('--hue', 190);

    if (view === 'deck')     V.renderDeck();
    if (view === 'agent')    V.renderAgent(o.agentId, o);
    if (view === 'progress') V.renderProgress();
    if (view === 'archive')  V.renderArchive();
    if (view === 'settings') V.renderSettings();

    const hash = view === 'agent' ? '#/agent/' + o.agentId : '#/' + view;
    if (location.hash !== hash) history.replaceState(null, '', hash);

    window.scrollTo({ top: 0, behavior: U.reduceMotion() ? 'auto' : 'smooth' });
    syncHud();
  }

  function fromHash() {
    const m = (location.hash || '').match(/^#\/agent\/([a-z]+)/);
    if (m && P.agents.byId[m[1]] && PR.isUnlocked(m[1])) return { view: 'agent', agentId: m[1] };
    const v = (location.hash || '').replace('#/', '');
    return { view: VIEWS.indexOf(v) !== -1 ? v : 'deck' };
  }

  /* ══════════════════════════════════════════════════════════
     The beam
     ══════════════════════════════════════════════════════════ */

  function refract(text) {
    const q = String(text || '').trim();
    if (!q) return;

    const hits = P.engine.route(q);

    if (!hits.length) {
      toast('Nothing matched — try naming what you want to make', '?');
      P.fx.sfx.error();
      return;
    }

    const open = hits.filter(h => !h.locked);
    const sealed = hits.filter(h => h.locked);

    // Either nothing usable matched, or a sealed facet is a far better
    // answer than anything open. Say which facet owns this and what it
    // costs, rather than quietly routing to a weak second choice.
    const outranked = sealed.length && open.length && sealed[0].score >= open[0].score * 1.5;

    if (!open.length || outranked) {
      const best = sealed[0];
      const st = PR.standing();
      modal(
        best.agent.name + ' handles this',
        '“' + q + '” is ' + best.agent.role.toLowerCase() + ' — that facet unseals at level ' +
        best.agent.unlock.level + '. You are level ' + st.level + ', ' + st.toNext + ' XP off level ' + (st.level + 1) + '.',
        el('p', { style: { color: 'var(--ink-3)', fontSize: '13.5px' } },
          'Every mission you run gets you there. Nothing is paywalled — the facets are extra range, not the basics.')
      );
      P.fx.sfx.error();
      return;
    }

    // One clear winner goes straight through; a close call asks.
    if (open.length === 1 || open[0].score >= open[1].score * 1.6) {
      const hit = open[0];
      P.fx.sfx.open();
      go('agent', {
        agentId: hit.agentId,
        missionId: hit.missionId,
        prefill: P.engine.prefill(hit.mission, q)
      });
      toast('Routed to ' + hit.agent.name + ' · ' + hit.mission.title, '▶');
      return;
    }

    const choices = el('div.qlist', {}, open.slice(0, 3).map(h =>
      el('button.quest', { type: 'button', style: { '--hue': h.agent.hue }, 'data-pick': h.agentId + '/' + h.missionId },
        el('div.quest__tick', '▶'),
        el('div.quest__t', el('b', h.agent.name + ' · ' + h.mission.title), el('span', h.mission.gives)))
    ));

    const close = modal('Which one did you mean?', '“' + q + '”', choices);

    choices.addEventListener('click', e => {
      const btn = e.target.closest && e.target.closest('[data-pick]');
      if (!btn) return;
      const [agentId, missionId] = btn.getAttribute('data-pick').split('/');
      close();
      go('agent', {
        agentId, missionId,
        prefill: P.engine.prefill(P.agents.findMission(agentId, missionId), q)
      });
    });
  }

  /* ══════════════════════════════════════════════════════════
     Global wiring
     ══════════════════════════════════════════════════════════ */

  function wire() {
    // Anything with data-nav navigates.
    document.addEventListener('click', e => {
      const nav = e.target.closest && e.target.closest('[data-nav]');
      if (nav) { P.fx.sfx.tap(); go(nav.getAttribute('data-nav')); return; }

      const facet = e.target.closest && e.target.closest('.facet[data-agent]');
      if (facet && !facet.disabled) {
        P.fx.sfx.open();
        go('agent', { agentId: facet.getAttribute('data-agent') });
        return;
      }

      const nextCard = e.target.closest && e.target.closest('.nextcard[data-agent]');
      if (nextCard && !nextCard.disabled && nextCard.getAttribute('data-agent')) {
        P.fx.sfx.open();
        go('agent', {
          agentId: nextCard.getAttribute('data-agent'),
          missionId: nextCard.getAttribute('data-mission')
        });
        return;
      }

      const hint = e.target.closest && e.target.closest('[data-hint]');
      if (hint) {
        U.$('#beam-input').value = hint.getAttribute('data-hint');
        refract(hint.getAttribute('data-hint'));
      }
    });

    U.$('#beam-form').addEventListener('submit', e => {
      e.preventDefault();
      refract(U.$('#beam-input').value);
    });

    window.addEventListener('hashchange', () => {
      const r = fromHash();
      if (r.view !== current || r.agentId) go(r.view, r);
    });

    // Keyboard: / focuses the beam, Escape goes home.
    document.addEventListener('keydown', e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === '/' && !typing) { e.preventDefault(); go('deck'); U.$('#beam-input').focus(); }
      if (e.key === 'Escape' && typing) document.activeElement.blur();
    });

    PR.onChain(syncChain);
    S.on(syncHud);
  }

  /* ══════════════════════════════════════════════════════════
     Boot
     ══════════════════════════════════════════════════════════ */

  const BOOT_LINES = [
    'initialising spectrum…',
    'aligning facets…',
    'calibrating dispersion…',
    'deck ready'
  ];

  async function boot() {
    const first = S.get().runs === 0 && !S.get().lastActiveDay;
    const bootEl = U.$('#boot');
    const line = U.$('#boot-line');
    const fill = U.$('#boot-fill');

    P.fx.init();

    // Returning users get a much shorter curtain.
    const step = first ? 520 : 190;

    for (let i = 0; i < BOOT_LINES.length; i++) {
      line.textContent = BOOT_LINES[i];
      fill.style.width = ((i + 1) / BOOT_LINES.length * 100) + '%';
      await U.wait(step);
    }

    const day = PR.touchDay();

    bootEl.classList.add('boot--gone');
    setTimeout(() => { bootEl.hidden = true; }, 800);

    U.$('#hud').hidden = false;
    U.$('#stage').hidden = false;

    wire();
    syncChain({ mult: 1, live: false, frac: 0 });

    const r = fromHash();
    go(r.view, r);

    // Day-turn payouts land after the deck is up.
    if (day.newDay && S.get().runs > 0) {
      setTimeout(() => {
        if (day.streakBroken) {
          toast('Streak reset — starting again at day 1', '◆');
        } else if (day.streak > 1) {
          pop('day ' + day.streak, 'Streak alive', 'run one mission to keep it', 32);
          P.fx.sfx.reward();
        }
        toast('Three fresh directives are up', '▤');
      }, 700);
    }

    if (first) {
      setTimeout(() => {
        toast('Tap a facet, or type what you need into the beam', '▶');
      }, 900);
    }
  }

  return { boot, go, toast, pop, celebrate, modal, archive, syncHud, refract };
})();

document.addEventListener('DOMContentLoaded', () => P.app.boot());

</script>
