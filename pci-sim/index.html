<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Educational PCI simulator: stent a 90% mid-LAD stenosis via right radial access. For education and demonstration only." />
    <title>PCI Simulator — Mid-LAD (educational)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28s-11-7-11-15a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 8-11 15-11 15z' fill='%23d9463b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-label="Procedure view"></canvas>
      <div id="labels" aria-hidden="true"></div>
      <div id="monitor-overlay" aria-live="off"></div>
      <div id="pip-label" class="hidden">LIH · X-ray</div>
      <div id="hover-readout" class="hidden"></div>
      <header id="hud"></header>
      <aside id="checklist" aria-label="Procedure stages"></aside>
      <aside id="right">
        <section id="vitals" aria-label="Patient monitor"></section>
        <section id="mentor" aria-label="Mentor"></section>
      </aside>
      <div id="bottom">
        <div id="messages" aria-live="polite"></div>
        <div id="device-panel"></div>
        <nav id="toolbar" aria-label="Tools"></nav>
      </div>
      <div id="tooltip" role="tooltip" class="hidden"></div>
      <div id="start" class="overlay"></div>
      <div id="pause" class="overlay hidden"></div>
      <div id="help" class="overlay hidden"></div>
      <div id="debrief" class="overlay hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
