<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HYPERSCALE · by Coach Colin</title>
  <meta name="description" content="HYPERSCALE by Coach Colin: the physics and maths of an AI data center. Train a model with the 6ND compute rule and the Chinchilla scaling law, power the campus (PUE, grid and carbon), cool 100 kW racks with air or water (Q = m·cp·ΔT), wire 65,536 GPUs with a fat-tree fabric (ring all-reduce), then run the hottest day of the year." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0614'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%2311141b' stroke='%2358e0ff' stroke-width='1.5'/%3E%3Cpath d='M11 10h10M11 14h10M11 18h10M11 22h6' stroke='%2358e0ff' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="letterbox" data-tab="train">
  <canvas id="scene"></canvas>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div class="brand panel"><span class="logo">▦</span><span class="brand-name">HYPERSCALE</span><span class="brand-by" data-i18n="app.by"></span></div>
      <nav id="tabs" class="views panel">
        <button data-tab="train"><kbd>1</kbd> <span data-i18n="tab.train"></span></button>
        <button data-tab="power"><kbd>2</kbd> <span data-i18n="tab.power"></span></button>
        <button data-tab="cool"><kbd>3</kbd> <span data-i18n="tab.cool"></span></button>
        <button data-tab="fabric"><kbd>4</kbd> <span data-i18n="tab.fabric"></span></button>
        <button data-tab="ops"><kbd>5</kbd> <span data-i18n="tab.ops"></span></button>
      </nav>
      <div class="actions">
        <button class="btn panel" id="btn-report"><span data-i18n="app.report"></span></button>
        <button class="btn panel demo" id="btn-tour"><span data-i18n="app.tour"></span></button>
        <button class="btn panel lang" id="btn-lang" data-i18n="app.lang"></button>
      </div>
    </header>
    <section id="panel" class="panel"></section>
    <section id="side" class="panel"></section>
    <div id="clear" class="mono"></div>
    <div id="caption"></div>
    <div id="feed"></div>
    <div id="demo-bar" class="hidden mono"><span class="dot"></span><span data-i18n="app.tourOn"></span></div>
    <footer class="hint mono" data-i18n="app.hint"></footer>
  </div>

  <div class="keyart" id="keyart"></div>
  <section id="start">
    <div class="start-card panel">
      <div class="start-kicker mono">TRAIN · POWER · COOL · FABRIC · OPERATE</div>
      <h1 data-i18n="app.title"></h1>
      <p class="sub" data-i18n="app.sub"></p>
      <p class="byline" data-i18n="app.by"></p>
      <div class="disclaimer">
        <h2>⚠ <span data-i18n="app.disclaimer.h"></span></h2>
        <p data-i18n="app.disclaimer"></p>
        <label class="ack"><input type="checkbox" id="ack" /> <span data-i18n="app.ack"></span></label>
      </div>
      <div class="start-actions">
        <button class="btn primary" id="btn-start" disabled data-i18n="app.start"></button>
        <button class="btn panel demo" id="btn-start-tour" disabled data-i18n="app.tour"></button>
        <button class="btn panel lang" id="btn-lang-start" data-i18n="app.lang"></button>
      </div>
    </div>
  </section>

  <section id="report" class="hidden">
    <div class="db-card panel">
      <div class="db-head">
        <div><div class="start-kicker mono">HYPERSCALE · COMMISSIONING REPORT</div><h2 id="rep-title"></h2><p class="db-sub" id="rep-sub"></p></div>
        <div class="db-ring" id="rep-ring"><b class="mono">0</b><small>%</small></div>
      </div>
      <ul class="db-checks" id="rep-list"></ul>
      <h3 data-i18n="rep.next"></h3>
      <ol class="db-tips" id="rep-next"></ol>
      <p class="db-disclaimer" data-i18n="rep.note"></p>
      <div class="start-actions">
        <button class="btn primary" id="rep-print" data-i18n="rep.print"></button>
        <button class="btn panel" id="rep-close" data-i18n="rep.close"></button>
      </div>
    </div>
  </section>

  <div id="boot" class="mono">LOADING…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
