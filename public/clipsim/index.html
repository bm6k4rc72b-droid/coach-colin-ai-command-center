<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IC-PC Clipping Simulator · by Coach Colin</title>
  <meta name="description" content="Educational browser simulator of microsurgical clipping of a right IC-PC aneurysm via a pterional transsylvian approach. By Coach Colin. Not clinical training or medical advice." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233ff3ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff4fd8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Three.js is vendored (r168), so the app runs offline with no CDN or build step. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="labels"></div>
  <div id="inspector"><div class="name"></div><div class="note"></div></div>
  <div id="reticle">
    <svg viewBox="0 0 40 40"><circle class="ring" cx="20" cy="20" r="11"/><circle class="prog" cx="20" cy="20" r="18"/><path class="cross" d="M20 4v7M20 29v7M4 20h7M29 20h7"/></svg>
    <div class="act"></div>
  </div>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div class="brand panel">
        <span class="logo">◉</span>
        <span class="brand-name">CLIPSIM</span>
        <span class="brand-by" data-i18n="app.by"></span>
      </div>
      <div class="chip panel mono" data-i18n="hud.milestone"></div>
      <button class="btn panel" id="btn-tool-none"><span data-i18n="hud.hand"></span> <kbd>Esc</kbd></button>
      <div class="actions">
        <button class="btn panel demo" id="btn-demo"><span data-i18n="hud.demo"></span></button>
        <button class="btn panel" id="btn-end"><span data-i18n="hud.end"></span></button>
        <button class="btn panel" id="btn-labels"><span data-i18n="hud.labels"></span> <kbd>L</kbd></button>
        <button class="btn panel" id="btn-reset"><span data-i18n="hud.reset"></span> <kbd>R</kbd></button>
        <button class="btn panel lang" id="btn-lang" data-i18n="app.lang"></button>
      </div>
    </header>

    <div id="feed"></div>
    <div id="demo-bar" class="hidden mono"><span class="dot"></span><span data-i18n="demo.bar"></span></div>
    <div id="banner"><div class="b-kicker mono"></div><div class="b-title"></div></div>

    <aside id="checklist" class="panel">
      <div class="cl-head"><span data-i18n="cl.title"></span><span class="mono" id="cl-total">0%</span></div>
      <ol id="cl-list"></ol>
    </aside>

    <section id="mentor" class="panel">
      <header class="m-head"><span class="m-kicker mono"></span><span class="m-pct mono">0%</span><span class="m-chev">▾</span></header>
      <div class="m-bar"><i></i></div>
      <div class="m-body">
        <h3 class="m-title"></h3>
        <p class="m-text"></p>
        <ul class="m-tasks"></ul>
        <div class="m-hint"></div>
      </div>
    </section>

    <section id="vitals" class="panel" data-alarm="0">
      <header class="v-head mono"><span data-i18n="v.title"></span><span id="v-alarm" class="v-alarm"></span><button id="v-mute" class="v-mute" title="Mute monitor">♪</button></header>
      <div class="v-row hr"><canvas id="ecg"></canvas><div class="v-num"><label>HR</label><b id="v-hr" class="mono">72</b></div></div>
      <div class="v-row art"><canvas id="art"></canvas><div class="v-num"><label>ART</label><b id="v-art" class="mono">114/70</b><small id="v-map" class="mono">(85)</small></div></div>
      <div class="v-grid mono">
        <div class="v-cell spo2"><label>SpO₂</label><b id="v-spo2">99</b><small>%</small></div>
        <div class="v-cell mep"><label>MEP</label><b id="v-mep">100</b><small>%</small><div class="v-bar"><i id="v-mepbar"></i></div></div>
        <div class="v-cell"><label data-i18n="v.optime"></label><b id="v-op">00:00</b></div>
        <div class="v-cell occl"><label data-i18n="v.occl"></label><b id="v-occl">--:--</b></div>
        <div class="v-cell"><label data-i18n="v.ebl"></label><b id="v-ebl">0</b><small>ml</small></div>
        <div class="v-cell"><label data-i18n="v.pool"></label><b id="v-pool">0.0</b><small>ml</small></div>
      </div>
      <footer class="v-foot mono">× <b id="ro-mag">6.0</b> · WD <b id="ro-wd">86</b> · <span data-i18n="hud.neck"></span> <b id="ro-neck">0</b>%<span id="ro-clip-row" class="hidden"> · <span data-i18n="hud.clip"></span> <b id="ro-clip"></b></span></footer>
    </section>

    <div id="pip" class="hidden">
      <div class="pip-head panel mono"><span data-i18n="pip.title"></span><span class="rec">● LIVE</span></div>
      <div class="pip-view"></div>
    </div>

    <div id="toolcard" class="panel hidden">
      <div class="tc-name"></div>
      <div class="tc-rule"></div>
      <div class="tc-ctrl mono"></div>
      <div class="tc-clip hidden">
        <button class="btn seg" data-cliptype="straight" data-i18n="clip.straight"></button>
        <button class="btn seg" data-cliptype="curved" data-i18n="clip.curved"></button>
        <kbd>C</kbd>
      </div>
    </div>
    <nav id="toolbar" class="panel"></nav>

    <footer class="hint mono" data-i18n="hud.hint"></footer>
  </div>

  <section id="start">
    <div class="start-card panel">
      <div class="start-kicker mono">NEUROVASCULAR · MICROSURGERY · EDU</div>
      <h1 data-i18n="app.title"></h1>
      <p class="sub" data-i18n="app.sub"></p>
      <p class="byline" data-i18n="app.by"></p>

      <div class="disclaimer">
        <h2>⚠ <span data-i18n="app.disclaimer.h"></span></h2>
        <p data-i18n="app.disclaimer"></p>
        <label class="ack"><input type="checkbox" id="ack" /> <span data-i18n="app.ack"></span></label>
      </div>

      <div class="controls-help">
        <h3 data-i18n="app.controls.h"></h3>
        <p data-i18n="app.controls"></p>
      </div>

      <div class="start-actions">
        <button class="btn primary" id="btn-start" disabled data-i18n="app.start"></button>
        <button class="btn panel" id="btn-start-demo" disabled data-i18n="app.demo"></button>
        <button class="btn panel lang" id="btn-lang-start" data-i18n="app.lang"></button>
      </div>
    </div>
  </section>

  <section id="debrief" class="hidden">
    <div class="db-card panel">
      <div class="db-head">
        <div>
          <div class="start-kicker mono" data-i18n="db.kicker"></div>
          <h2 data-i18n="db.title"></h2>
          <p class="db-sub"><span data-i18n="app.title"></span> · <span data-i18n="app.by"></span></p>
        </div>
        <div class="db-ring" id="db-ring"><b id="db-score" class="mono">0</b><small data-i18n="db.score"></small></div>
      </div>
      <p id="db-demo" class="db-note hidden" data-i18n="db.demoNote"></p>
      <div class="db-grid mono">
        <div><label data-i18n="db.time"></label><b id="db-time"></b></div>
        <div><label data-i18n="db.ebl"></label><b id="db-ebl"></b></div>
        <div><label data-i18n="db.occl"></label><b id="db-occl"></b></div>
        <div><label data-i18n="db.rupture"></label><b id="db-rupture"></b></div>
        <div><label data-i18n="db.clip"></label><b id="db-clip"></b></div>
        <div><label data-i18n="db.mep"></label><b id="db-mep"></b></div>
        <div><label data-i18n="db.map"></label><b id="db-map"></b></div>
        <div><label data-i18n="db.stages"></label><b id="db-stages"></b></div>
      </div>
      <div class="db-cols">
        <div><h3 data-i18n="db.clipCheck"></h3><ul id="db-clipdetail" class="db-checks"></ul></div>
        <div><h3 data-i18n="db.tips"></h3><ol id="db-tips" class="db-tips"></ol></div>
      </div>
      <p class="db-disclaimer" data-i18n="db.disclaimer"></p>
      <div class="start-actions">
        <button class="btn primary" id="db-restart" data-i18n="db.restart"></button>
        <button class="btn panel" id="db-close" data-i18n="db.continue"></button>
      </div>
    </div>
  </section>

  <div id="boot" class="mono">INITIALISING OPTICS…</div>

  <script type="module" src="./main.js"></script>
</body>
</html>
