<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAPTOR LAB · by Coach Colin</title>
  <meta name="description" content="RAPTOR LAB by Coach Colin: an educational simulator of a generic full-flow staged-combustion methane/oxygen rocket engine on a test stand, with real nozzle theory and turbopump dynamics." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 3h12l-2 10 5 16H7l5-16z' fill='none' stroke='%233ff3ff' stroke-width='2.5'/%3E%3Cpath d='M13 22h6l-3 8z' fill='%23ff4fd8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Three.js is vendored (r168), so the app runs offline with no CDN or build step. -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="letterbox">
  <canvas id="scene"></canvas>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div class="brand panel">
        <span class="logo">▲</span>
        <span class="brand-name">RAPTOR LAB</span>
        <span class="brand-by" data-i18n="app.by"></span>
      </div>
      <div class="chip panel mono">FULL-FLOW · CH₄/LOX · SEA-LEVEL STAND</div>
      <div class="actions">
        <button class="btn panel" id="btn-view"><span data-i18n="app.view"></span><kbd>Z</kbd></button>
        <button class="btn panel" id="btn-cut"><span data-i18n="app.cut"></span><kbd>C</kbd></button>
        <button class="btn panel" id="btn-exp"><span data-i18n="app.exp"></span><kbd>X</kbd></button>
        <button class="btn panel" id="btn-scope"><span data-i18n="app.scope"></span><kbd>V</kbd></button>
        <button class="btn panel demo" id="btn-demo"><span data-i18n="app.demoBtn"></span></button>
        <button class="btn panel" id="btn-end"><span data-i18n="app.end"></span></button>
        <button class="btn panel lang" id="btn-lang" data-i18n="app.lang"></button>
      </div>
    </header>

    <div id="feed"></div>
    <div id="demo-bar" class="hidden mono"><span class="dot"></span><span data-i18n="app.demoOn"></span></div>
    <div id="banner"><div class="b-kicker mono"></div><div class="b-title"></div></div>

    <aside id="checklist" class="panel">
      <div class="cl-head"><span class="cl-title"></span><span class="cl-total mono">0%</span></div>
      <ol class="cl-list"></ol>
    </aside>

    <section id="live" class="panel"></section>

    <div id="scope" class="hidden">
      <div class="pip-head panel mono"><span id="scope-title"></span><span class="rec">● LIVE</span></div>
      <div class="scope-view"></div>
    </div>

    <section id="mentor" class="panel">
      <header class="m-head"><span class="m-kicker mono"></span><span class="m-pct mono">0%</span><span class="m-chev">▾</span></header>
      <div class="m-bar"><i></i></div>
      <div class="m-body">
        <h3 class="m-title"></h3>
        <p class="m-text"></p>
        <ul class="m-tasks"></ul>
        <div class="m-hint"></div>
      </div>
    </section>

    <section id="chooser" class="panel hidden">
      <div class="ch-head"><span class="ch-title"></span><button class="ch-x" aria-label="Close">✕</button></div>
      <div class="ch-body"></div>
    </section>

    <div id="toolcard" class="panel hidden"><div class="tc-name"></div><div class="tc-rule"></div></div>
    <nav id="toolbar" class="panel"></nav>
    <footer class="hint mono" data-i18n="app.hint"></footer>
  </div>

  <div class="keyart" id="keyart"></div>
  <section id="start">
    <div class="start-card panel">
      <div class="start-kicker mono">PROPULSION · TURBOMACHINERY · EDU</div>
      <h1 data-i18n="app.title"></h1>
      <p class="sub" data-i18n="app.sub"></p>
      <p class="byline" data-i18n="app.by"></p>
      <div class="disclaimer">
        <h2>⚠ <span data-i18n="app.disclaimer.h"></span></h2>
        <p data-i18n="app.disclaimer"></p>
        <label class="ack"><input type="checkbox" id="ack" /> <span data-i18n="app.ack"></span></label>
      </div>
      <div class="controls-help">
        <h3 data-i18n="app.controls.h"></h3>
        <p data-i18n="app.controls"></p>
      </div>
      <div class="start-actions">
        <button class="btn primary" id="btn-start" disabled data-i18n="app.start"></button>
        <button class="btn panel demo" id="btn-start-demo" disabled data-i18n="app.demo"></button>
        <button class="btn panel lang" id="btn-lang-start" data-i18n="app.lang"></button>
      </div>
    </div>
  </section>

  <section id="debrief" class="hidden">
    <div class="db-card panel">
      <div class="db-head">
        <div>
          <div class="start-kicker mono">POST-TEST REVIEW</div>
          <h2 class="db-title"></h2>
          <p class="db-sub"></p>
        </div>
        <div class="db-ring"><b class="db-score mono">0</b><small>SCORE</small></div>
      </div>
      <div class="db-grid mono"></div>
      <div class="db-cols">
        <div><h3 data-i18n="db.checks"></h3><ul class="db-checks"></ul></div>
        <div><h3 data-i18n="db.tips"></h3><ol class="db-tips"></ol></div>
      </div>
      <div class="start-actions">
        <button class="btn primary db-again" data-i18n="db.again"></button>
        <button class="btn panel db-close" data-i18n="db.close"></button>
      </div>
      <p class="db-disclaimer" data-i18n="app.disclaimer"></p>
    </div>
  </section>

  <div id="boot" class="mono">LOADING…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
