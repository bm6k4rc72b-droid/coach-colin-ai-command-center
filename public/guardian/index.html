<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GUARDIAN · by Coach Colin</title>
  <meta name="description" content="GUARDIAN by Coach Colin: home fall-hazard walk-through, CDC STEADI balance check, scam-spotting trainer and a caregiver dashboard. Education only." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 4v8c0 7-5 12-11 14C10 27 5 22 5 15V7z' fill='none' stroke='%233ff3ff' stroke-width='2.5'/%3E%3Cpath d='M11 16l4 4 7-8' fill='none' stroke='%235dffa8' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body class="letterbox" data-tab="home">
  <canvas id="scene"></canvas>

  <div id="hud" class="hidden">
    <header class="topbar">
      <div class="brand panel"><span class="logo">⛨</span><span class="brand-name">GUARDIAN</span><span class="brand-by" data-i18n="app.by"></span></div>
      <nav id="tabs" class="views panel">
        <button data-tab="home"><kbd>1</kbd> <span data-i18n="tab.home"></span></button>
        <button data-tab="balance"><kbd>2</kbd> <span data-i18n="tab.balance"></span></button>
        <button data-tab="scams"><kbd>3</kbd> <span data-i18n="tab.scams"></span></button>
        <button data-tab="care"><kbd>4</kbd> <span data-i18n="tab.care"></span></button>
      </nav>
      <div class="actions">
        <button class="btn panel" id="btn-report"><span data-i18n="app.report"></span></button>
        <button class="btn panel demo" id="btn-tour"><span data-i18n="app.tour"></span></button>
        <button class="btn panel lang" id="btn-lang" data-i18n="app.lang"></button>
      </div>
    </header>

    <aside id="index" class="panel">
      <header class="lv-head mono" data-i18n="idx.title"></header>
      <div class="rings">
        <div class="ring" data-k="home"><div class="r"><b class="mono">—</b></div><span data-i18n="idx.home"></span></div>
        <div class="ring" data-k="balance"><div class="r"><b class="mono">—</b></div><span data-i18n="idx.balance"></span></div>
        <div class="ring" data-k="scams"><div class="r"><b class="mono">—</b></div><span data-i18n="idx.scams"></span></div>
        <div class="ring" data-k="care"><div class="r"><b class="mono">—</b></div><span data-i18n="idx.care"></span></div>
      </div>
    </aside>

    <section id="panel" class="panel"></section>

    <section id="detail" class="panel hidden">
      <div class="d-head"><b class="d-name"></b><span class="d-w mono"></span><button class="d-x" aria-label="Close">✕</button></div>
      <p class="d-why"></p>
      <p class="d-fix"></p>
      <button class="btn primary d-btn"></button>
    </section>

    <div id="feed"></div>
    <div id="demo-bar" class="hidden mono"><span class="dot"></span><span data-i18n="app.tourOn"></span></div>
    <footer class="hint mono" data-i18n="app.hint"></footer>
  </div>

  <div class="keyart" id="keyart"></div>
  <section id="start">
    <div class="start-card panel">
      <div class="start-kicker mono">AGEING WELL · SAFETY · FAMILY</div>
      <h1 data-i18n="app.title"></h1>
      <p class="sub" data-i18n="app.sub"></p>
      <p class="byline" data-i18n="app.by"></p>
      <div class="disclaimer">
        <h2>⚠ <span data-i18n="app.disclaimer.h"></span></h2>
        <p data-i18n="app.disclaimer"></p>
        <label class="ack"><input type="checkbox" id="ack" /> <span data-i18n="app.ack"></span></label>
      </div>
      <div class="start-actions">
        <button class="btn primary" id="btn-start" disabled data-i18n="app.start"></button>
        <button class="btn panel demo" id="btn-start-tour" disabled data-i18n="app.tour"></button>
        <button class="btn panel lang" id="btn-lang-start" data-i18n="app.lang"></button>
      </div>
    </div>
  </section>

  <section id="report" class="hidden">
    <div class="db-card panel">
      <div class="db-head">
        <div><div class="start-kicker mono">GUARDIAN</div><h2 data-i18n="rep.title"></h2><p class="db-sub" id="rep-sub"></p></div>
        <div class="db-ring" id="rep-ring"><b class="mono">0</b><small>INDEX</small></div>
      </div>
      <ul class="db-checks" id="rep-list"></ul>
      <h3 data-i18n="rep.next"></h3>
      <ol class="db-tips" id="rep-next"></ol>
      <p class="db-disclaimer" data-i18n="rep.note"></p>
      <div class="start-actions">
        <button class="btn primary" id="rep-print" data-i18n="rep.print"></button>
        <button class="btn panel" id="rep-close" data-i18n="rep.close"></button>
      </div>
    </div>
  </section>

  <div id="boot" class="mono">LOADING…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
