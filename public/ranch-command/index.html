<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RANCH COMMAND · Intelligence Network</title>
<meta name="description" content="RANCH COMMAND: a ranch security and operations dashboard. Live iPhone, IP and drone cameras; on-device AI detection; NanoOWL text search and NanoSAM segmentation on an NVIDIA Jetson edge box; Frigate alerts routed to security, livestock or wildlife; ArduPilot drone telemetry with human-approved missions; Meshtastic off-grid mesh; a 3D ranch map. Swipe, wave at the camera, or ask Rafa.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ranch Cmd">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="bg-grid"></div><div class="bg-glow glow-a"></div><div class="bg-glow glow-b"></div><div class="bg-glow glow-c"></div></div>
<div id="scan" aria-hidden="true"></div>

<!-- The gate. One tap unlocks speech and the camera prompts, which iOS only allows from a gesture. -->
<section id="gate" aria-label="Enter">
  <div class="gate-inner">
    <div class="gate-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="kicker">Concept architecture · live build</p>
    <h1 class="holo">RANCH COMMAND</h1>
    <p class="gate-sub">Intelligence Network</p>
    <button id="enter" class="btn gold xl" type="button">Enter Command</button>
    <button id="enter-quiet" class="btn ghost" type="button">Enter without sound</button>
    <p class="gate-note">Edge AI built for NVIDIA<sup>®</sup> Jetson<sup>™</sup></p>
  </div>
</section>

<header id="top">
  <a class="brand" href="#command" aria-label="Ranch Command home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text holo">RANCH COMMAND</span></a>
  <div id="links" class="links" aria-live="polite"></div>
  <div class="top-actions">
    <button id="btn-swipe" class="chip-btn" type="button" aria-pressed="false" title="Air Swipe: wave at the camera to change slides" aria-label="Air Swipe"><span aria-hidden="true">✋</span><span class="lbl">Air Swipe</span></button>
    <button id="btn-tilt" class="chip-btn" type="button" aria-pressed="false" title="Tilt parallax" aria-label="Tilt"><span aria-hidden="true">◈</span><span class="lbl">Tilt</span></button>
    <button id="btn-voice" class="chip-btn" type="button" aria-pressed="true" title="Rafa's voice" aria-label="Rafa's voice"><span id="voice-ico" aria-hidden="true">🔊</span><span class="lbl">Rafa</span></button>
  </div>
</header>

<main id="track" tabindex="0" aria-label="Ranch Command slides"></main>

<nav id="dots" aria-label="Slides"></nav>
<button id="prev" class="nav-arrow left" type="button" aria-label="Previous slide">‹</button>
<button id="next" class="nav-arrow right" type="button" aria-label="Next slide">›</button>

<!-- Air Swipe HUD: the camera's view of your hand, so you can see what it sees. -->
<aside id="hud" hidden aria-label="Air Swipe camera">
  <video id="hud-video" playsinline muted></video>
  <canvas id="hud-canvas" width="160" height="120"></canvas>
  <div class="hud-meter"><span id="hud-dot"></span></div>
  <span id="hud-label">Air Swipe</span>
</aside>

<!-- Rafa -->
<footer id="rafa">
  <button id="rafa-orb" class="rafa-orb" type="button" aria-label="Rafa — tap for a joke"><span></span></button>
  <div class="rafa-body">
    <p class="rafa-name">RAFA <span>· ranch foreman AI</span></p>
    <p id="rafa-caption" class="rafa-caption" aria-live="polite">¡Bienvenidos!</p>
  </div>
  <form id="rafa-ask" class="rafa-ask" autocomplete="off">
    <input id="rafa-input" type="text" placeholder="Ask Rafa… “tour”, “DJI”, “NanoOWL”" aria-label="Ask Rafa">
    <button id="rafa-mic" class="icon" type="button" aria-label="Speak to Rafa">🎙</button>
  </form>
</footer>

<div id="modal" hidden role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">RANCH COMMAND runs in the browser: JavaScript is required.</p></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
