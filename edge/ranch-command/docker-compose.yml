# RANCH COMMAND edge stack.
#
#   docker compose --profile x86    up -d   # PC with an NVIDIA GPU
#   docker compose --profile jetson up -d   # NVIDIA Jetson (JetPack 6)
#
# Everything listens on the edge box only. Reach it from the dashboard over
# HTTPS with Tailscale Serve (see README.md) — never by opening ports to the
# internet.

x-frigate: &frigate
  container_name: frigate
  restart: unless-stopped
  shm_size: "512mb"
  privileged: true
  volumes:
    - ./config/frigate.yml:/config/config.yml:ro
    - ./data/frigate:/media/frigate
    - type: tmpfs
      target: /tmp/cache
      tmpfs: { size: 1000000000 }
  ports:
    - "8971:8971"        # Frigate UI (authenticated)
    - "1984:1984"        # go2rtc API — WebRTC signalling for the dashboard
    - "8554:8554"        # RTSP restream
    - "8555:8555/tcp"    # WebRTC media
    - "8555:8555/udp"
  environment:
    FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD:?set FRIGATE_MQTT_PASSWORD in .env}
    FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-}
  depends_on: [mosquitto]

services:
  frigate-x86:
    <<: *frigate
    profiles: [x86]
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  frigate-jetson:
    <<: *frigate
    profiles: [jetson]
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt-jp6
    runtime: nvidia

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT for Frigate, radios, sensors
      - "9001:9001"      # MQTT over WebSocket for the dashboard
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto.passwd:/mosquitto/config/passwd:ro
      - ./data/mosquitto:/mosquitto/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP in, from DJI Fly / DJI Pilot 2 live streaming
      - "8888:8888"      # HLS out (plays natively on iPhone)
      - "8889:8889"      # WebRTC / WHEP out
      - "8189:8189/udp"  # WebRTC media
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro

  mavlink2rest:
    image: bluerobotics/mavlink2rest:latest
    container_name: mavlink2rest
    restart: unless-stopped
    # Listen for MAVLink from a ground station or a vehicle on UDP 14550
    # (QGroundControl / Mission Planner can forward to it), serve JSON on 8088.
    command: ["--connect", "udpin:0.0.0.0:14550", "--server", "0.0.0.0:8088"]
    ports:
      - "14550:14550/udp"
      - "8088:8088"

  ranch-edge:
    build: .
    container_name: ranch-edge
    restart: unless-stopped
    # x86 only. On a Jetson, install.sh runs ranch-edge inside the
    # jetson-containers NanoOWL image, which has TensorRT for that JetPack.
    profiles: [x86]
    ports:
      - "8787:8787"
    environment:
      FRIGATE_URL: http://frigate:5000
      GO2RTC_URL: http://frigate:1984
      MQTT_HOST: mosquitto
      MQTT_USER: ranch-edge
      MQTT_PASSWORD: ${RANCH_EDGE_MQTT_PASSWORD:?set RANCH_EDGE_MQTT_PASSWORD in .env}
      RULES_PATH: /app/rules.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://bm6k4rc72b-droid.github.io}
      CALVING_CAMERAS: ${CALVING_CAMERAS:-}
      COWCATCHER_WEIGHTS: ${COWCATCHER_WEIGHTS:-}
      RFDETR_WEIGHTS: ${RFDETR_WEIGHTS:-}
      # NanoOWL / NanoSAM run in the jetson-containers image on a Jetson; on
      # x86 these engines are built by install.sh if TensorRT is present.
      NANOOWL_ENGINE: /models/owl_image_encoder_patch32.engine
      NANOSAM_ENCODER: /models/resnet18_image_encoder.engine
      NANOSAM_DECODER: /models/mobile_sam_mask_decoder.engine
    volumes:
      - ../../public/ranch-command/rules.json:/app/rules.json:ro
      - ./data/models:/models
    depends_on: [mosquitto]
